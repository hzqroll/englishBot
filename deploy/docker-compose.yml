services:
  bot-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: english-bot-app
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ../data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: english-bot-napcat
    restart: unless-stopped
    environment:
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
    volumes:
      - ../data/napcat:/app/napcat/config
    ports:
      - "${NAPCAT_WEBUI_PORT:-6099}:6099"
    depends_on:
      - bot-app

  caddy:
    image: caddy:2.8-alpine
    container_name: english-bot-caddy
    restart: unless-stopped
    depends_on:
      - bot-app
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
