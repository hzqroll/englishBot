[project]
name = "english-learning-qq-bot"
version = "0.1.0"
description = "QQ English learning bot powered by NoneBot2, NapCat, SQLite and FastAPI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "itsdangerous>=2.2.0",
  "lark-oapi>=1.4.0",
  "jinja2>=3.1.4",
  "nonebot2[fastapi]>=2.4.1",
  "nonebot-adapter-onebot>=2.4.6",
  "nonebot-plugin-apscheduler>=0.5.0",
  "passlib[bcrypt]>=1.7.4",
  "pillow>=11.1.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "tenacity>=9.0.0",
  "tencentcloud-sdk-python>=3.0.1399",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["admin/templates/*.html", "admin/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
