<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "English Bot Admin" }}</title>
    <link rel="stylesheet" href="/admin/static/admin.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">Learning Console</p>
          <h1>English Bot</h1>
          <p class="brand-copy">面向群英语学习运营、纠错复盘与每日进度跟踪的后台工作台。</p>
        </div>
        <nav class="nav-list">
          <a class="nav-link {% if request.url.path == '/admin' %}active{% endif %}" href="/admin">
            <span class="nav-kicker">Overview</span>
            <strong>仪表盘</strong>
          </a>
          <a class="nav-link {% if request.url.path.startswith('/admin/users') %}active{% endif %}" href="/admin/users">
            <span class="nav-kicker">People</span>
            <strong>用户</strong>
          </a>
          <a class="nav-link {% if request.url.path.startswith('/admin/groups') %}active{% endif %}" href="/admin/groups">
            <span class="nav-kicker">Groups</span>
            <strong>学习群</strong>
          </a>
          <a class="nav-link {% if request.url.path.startswith('/admin/settings') %}active{% endif %}" href="/admin/settings">
            <span class="nav-kicker">Config</span>
            <strong>动态配置</strong>
          </a>
          <a class="nav-link {% if request.url.path.startswith('/admin/job-runs') %}active{% endif %}" href="/admin/job-runs">
            <span class="nav-kicker">Jobs</span>
            <strong>任务执行</strong>
          </a>
          <a class="nav-link {% if request.url.path.startswith('/admin/delivery-logs') %}active{% endif %}" href="/admin/delivery-logs">
            <span class="nav-kicker">Delivery</span>
            <strong>发送日志</strong>
          </a>
          <a class="nav-link {% if request.url.path.startswith('/admin/debug') %}active{% endif %}" href="/admin/debug">
            <span class="nav-kicker">Tools</span>
            <strong>联调调试</strong>
          </a>
          <a class="nav-link {% if request.url.path.startswith('/admin/llm') %}active{% endif %}" href="/admin/llm">
            <span class="nav-kicker">LLM</span>
            <strong>提示词测试</strong>
          </a>
          <a class="nav-link nav-link-ghost" href="/admin/logout">
            <span class="nav-kicker">Session</span>
            <strong>退出登录</strong>
          </a>
        </nav>
        <div class="sidebar-note">
          <p class="sidebar-note-title">当前后台用途</p>
          <ul>
            <li>监控学习群活跃与任务执行</li>
            <li>手动触发晚间总结与周报</li>
            <li>调试翻译、纠错与落库链路</li>
          </ul>
        </div>
      </aside>
      <main class="main">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
