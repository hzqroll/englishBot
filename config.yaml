scheduler:
  daily_push_cron: "0 8 * * *"
  dialogue_guardian_cron: "*/10 9-20 * * *"
  daily_summary_cron: "0 20 * * *"
  weekly_report_cron: "0 9 * * 1"
  weekly_quiz_cron: "0 19 * * 0"
  nightly_backup_cron: "0 2 * * *"
  sync_feishu_messages_cron: "50 17 * * *"

content:
  default_source: ted
  ted_rss_urls:
    - "https://feeds.feedburner.com/tedtalks_audio"
    - "https://feeds.feedburner.com/TEDTalks_video"
  fallback_lesson_word_count: 180

learning:
  beginner_threshold: 20
  intermediate_quiz_threshold: 70
  weekly_quiz_question_count: 6
  weekly_quiz_review_ratio: 0.4
  daily_review_insert_count: 2
  score_per_task_completion: 10
  score_per_review_completion: 6
  score_per_quiz_completion: 20

admin:
  title: "English Bot Admin"
  enable_http_login_warning: true

feishu:
    enabled_group_ids:
      - "oc_9c6c87dddd8a0cb8277301607c1f20ff"
    context_ttl_minutes: 15
    docs:
        enabled: true
        folder_name: "englishImprovePlan"
        notify_chat_ids:
          - "oc_9c6c87dddd8a0cb8277301607c1f20ff"

friends:
    enabled: true
    start_date: "2026-04-08"
    daily_push_cron: "0 9 * * *"

prompts:
    # 英文纠错 — 返回 JSON 含 corrected_text, zh_translation, natural_expression, explanation, error_points[]
    correction_system: |
        你是英语学习助教。请严格返回 JSON，结构如下：
        {"corrected_text": "...", "zh_translation": "...", "natural_expression": "...", "explanation": "...", "error_points": [{"error_type": "tense|article|preposition|word_choice|spelling|expression|grammar|agreement|natural_expression", "source_fragment": "...", "correct_fragment": "...", "explanation": "..."}]}

    # 翻译优化 — 变量: {context}, {source_text}, {base_translation}
    improve_translation: |
        请将下面中文翻译优化为更自然的英文。
        保持简洁，只返回优化后的英文。
        上下文：{context}
        中文：{source_text}
        基础翻译：{base_translation}

    # 任务提交反馈 — 变量: {content}
    task_feedback: |
        请用 2 句话评价以下英语学习任务提交，给出鼓励和一个改进建议：
        {content}

    # 对话分析 — 返回 JSON 含 translated_dialogue, speaker_feedbacks[]
    dialogue_analysis_system: |
        你是英语学习助教。请严格返回 JSON，结构如下：
        {"translated_dialogue": "...", "speaker_feedbacks": [{"speaker": "...", "overall_comment": "...", "issues": ["..."}]}

        要求：
        1. 保留原始对话顺序和说话人标识。
        2. 如果原文已经是英文，只做轻微润色，不要改写语义。
        3. 只指出语言表达、语法、用词、自然度问题。
        4. 如果某个说话人没有明显问题，可以省略。

    # 周报总结 — 变量: {learning_days}, {task_completion_rate}, {correction_count}, {level}
    weekly_report_summary: |
        请生成一句简洁的英语学习周报鼓励语，语气积极，不超过 50 字。 学习天数：{learning_days}，完成率：{task_completion_rate}， 纠错次数：{correction_count}，当前等级：{level}。

    # 日进度总结 — 变量: {task_status}, {level_label}, {english_attempt_count}, {target_hit_count}, {correction_count}, {today_task_completed}, {today_task_total}, {mastery_label}, {mastery_reason}
    daily_progress_summary: |
        请用不超过 60 字生成一段英语学习日总结，语气积极、具体。 状态：{task_status}；等级：{level_label}； 英语尝试：{english_attempt_count}；目标词命中：{target_hit_count}； 纠错次数：{correction_count}；任务完成：{today_task_completed}/{today_task_total}； 掌握度：{mastery_label}；依据：{mastery_reason}

    # 会话托管开场故事 — 变量: {lesson_title}, {lesson_scene}, {required_chunks}, {time_window}
    dialogue_story_opener_prompt: |
        You are an English conversation facilitator for a group chat.

        Task:
        Write a short scenario story based on today's learning theme, then provide one opening line that invites people to continue the dialogue.

        Input:
        - Theme title: {lesson_title}
        - Scene context: {lesson_scene}
        - Must-reuse phrases: {required_chunks}
        - Current time window: {time_window}

        Output format (plain text only, no markdown):
        - Paragraph 1: A complete mini story in 4-6 sentences, vivid but realistic, easy for B1-B2 learners.
        - Paragraph 2: Exactly one opening line that someone can directly reply to in chat.

        Hard rules:
        - English only.
        - Keep it natural and conversational, not textbook style.
        - Reuse 1-2 must-reuse phrases naturally.
        - End Paragraph 2 with a question mark so the dialogue can continue.
        - No bullet points, no numbering, no labels.

    # 会话托管超时补句 — 变量: {lesson_title}, {required_chunks}, {latest_message}, {idle_minutes}
    dialogue_idle_followup_prompt: |
        You are an English conversation facilitator in a group chat.

        Task:
        Continue the conversation after silence, based on the latest group message.

        Input:
        - Theme title: {lesson_title}
        - Must-reuse phrases: {required_chunks}
        - Latest message: {latest_message}
        - Silence duration: {idle_minutes} minutes

        Output format (plain text only):
        - Exactly one sentence.
        - It must be easy to reply to and should move the conversation forward.

        Hard rules:
        - English only.
        - Natural tone, concise, no explanation.
        - Prefer an open-ended follow-up style.
        - If possible, include one must-reuse phrase naturally.
        - Do not repeat the latest message verbatim.

    # Friends 美剧对话分析 — 返回 JSON 含 translation, vocabulary, grammar, culture
    friends_analysis_system: |
        你是英语学习助教，擅长分析美剧对话。请严格返回 JSON，结构如下：
        {
          "translation": "对话的中文翻译，每行一句，用换行符分隔",
          "vocabulary": ["词汇/短语 (音标) — 释义: 例句", ...],
          "grammar": ["语法点1: 解析", "语法点2: 解析"],
          "culture": ["文化背景说明"]
        }

        要求：
        1. translation: 逐句翻译，保留说话人前缀，如 'Monica: 莫妮卡说的中文翻译'
        2. vocabulary: 挑选 3-5 个重点词汇/短语，包含音标和例句
        3. grammar: 1-2 个语法点，用简单中文解析
        4. culture: 如有文化背景需要说明则给出，没有则返回空数组 []
        5. 只返回 JSON，不要有其他文字
