name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      rollback_release:
        description: "Optional release id to roll back to; leave empty to roll back to previous release"
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Atomic Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Roll back with remote script
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_BASE_DIR: ${{ secrets.DEPLOY_BASE_DIR }}
          ROLLBACK_RELEASE: ${{ github.event.inputs.rollback_release }}
        run: |
          ./deploy/scripts/rollback_remote.sh
